<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Admin</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="admin-body">

    <header class="admin-header">
        <h1>Painel de Administração</h1>
        <button id="botao-logout">Sair</button>
    </header>

    <main class="admin-container">
        <h2>Adicionar Novo Artista</h2>
        
        <form id="form-add-artista">
            <div class="form-group">
                <label for="artista-nome">Nome do Artista</label>
                <input type="text" id="artista-nome" required>
            </div>
            
            <div class="form-group">
                <label for="artista-imagem">Imagem Principal (Logo/Perfil)</label>
                <input type="file" id="artista-imagem" accept="image/*" required>
            </div>
            
            <div class="form-group">
                <label for="artista-instagram">Instagram (Ex: @pixo.sp)</label>
                <input type="text" id="artista-instagram">
            </div>
            
            <div class="form-group">
                <label for="artista-categorias">Categorias (separadas por vírgula, ex: Pixo, Graff)</label>
                <input type="text" id="artista-categorias">
            </div>
            
            <button type="submit" id="botao-salvar-artista">Salvar Artista</button>
        </form>
        
        <div id="upload-status"></div>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>

# Ficheiro: admin/config.yml (VERSÃO COM GALERIA CORRETA)

backend:
  name: git-gateway
  branch: main

media_folder: "imagens/uploads"
public_folder: "/imagens/uploads"

collections:
  - name: "artistas"
    label: "Artistas"
    files:
      - label: "Banco de Dados de Artistas"
        name: "artistas_db"
        file: "_data/artistas.json"
        fields:
          - name: "lista_de_artistas"
            label: "Artistas"
            widget: "list"
            fields:
              - { label: "ID (Nome único, sem espaços, ex: LIGHT)", name: "id", widget: "string" }
              - { label: "Nome de Exibição", name: "nome", widget: "string" }
              - { label: "Logo do Artista", name: "logo", widget: "image" }
              - { label: "Link do Instagram (URL completa)", name: "instagramLink", widget: "string" }
              - { label: "Usuário do Instagram (ex: @LIGHT_452)", name: "instagramHandle", widget: "string" }

              # ===== A GRANDE MUDANÇA ESTÁ AQUI =====
              - label: "Galeria de Imagens"
                name: "imagens"
                widget: "image" # Mudamos de 'list' para 'image'
                allow_multiple: true # Permitimos múltiplas imagens
                media_library: # E garantimos que a biblioteca permite seleção múltipla
                  config:
                    multiple: true
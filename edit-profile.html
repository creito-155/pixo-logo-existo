<!DOCTYPE html>
<html lang="pt-br>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Painel de Admin</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="admin-body">

    <header class="admin-header">
        <h1>Editar Perfil</h1>
        <button id="botao-logout">Sair</button>
    </header>

    <main class="admin-container">
        <section id="edit-main-profile">
            <h2>Editar Informações Principais</h2>
            <form id="form-edit-artista">
                </form>
            <div id="update-status"></div>
        </section>

        <hr style="margin: 40px 0;">

        <section id="gallery-manager">
            <h2>Gerenciar Galeria de Fotos</h2>
            
            <div class="gallery-grid-admin" id="gallery-grid-admin">
                </div>
            
            <input type="file" id="gallery-file-input" multiple accept="image/*" style="display: none;">
            
            <div id="gallery-upload-status"></div>
        </section>
        
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Painel de Admin</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="admin-body">

    <header class="admin-header">
        <h1>Editar Perfil</h1>
        <button id="botao-logout" aria-label="Sair do painel">Sair</button>
    </header>

    <main class="admin-container">
        <section id="edit-main-profile">
            <h2>Editar Informações Principais</h2>
            <p>Altere os dados abaixo e clique em <strong>Atualizar Perfil</strong> para salvar.</p>
            
            <form id="form-edit-artista" autocomplete="off">
                <div class="form-group">
                    <label for="artista-nome">Nome do Artista</label>
                    <input type="text" id="artista-nome" required maxlength="40" placeholder="Ex: Pixo.SP">
                </div>
                
                <div class="form-group">
                    <label for="artista-imagem">Trocar Imagem Principal <span style="font-weight:normal;">(opcional)</span></label>
                    <input type="file" id="artista-imagem" accept="image/*">
                    <small>Deixe em branco se não quiser mudar a imagem atual.</small>
                </div>
                
                <div class="form-group">
                    <label for="artista-instagram">Instagram</label>
                    <input type="text" id="artista-instagram" maxlength="40" placeholder="@pixo.sp">
                </div>
                
                <div class="form-group">
                    <label>Categorias</label>
                    <div id="categorias-opcoes" style="display:flex; gap:20px; margin-top:8px;">
                        <label>
                            <input type="checkbox" name="categoria" value="Pixo"> Pixo
                        </label>
                        <label>
                            <input type="checkbox" name="categoria" value="Graff"> Graff
                        </label>
                    </div>
                    <small>Selecione uma ou mais opções.</small>
                </div>
                
                <button type="submit" id="botao-atualizar-artista">Atualizar Perfil</button>
            </form>
            
            <div id="update-status" class="status-message" aria-live="polite"></div>
        </section>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>

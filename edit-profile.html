<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Painel de Admin</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="admin-body">

    <header class="admin-header">
        <h1>Editar Perfil</h1>
        <button id="botao-logout">Sair</button>
    </header>

    <main class="admin-container">
        
        <section id="edit-main-profile">
            <h2>Editar Informações Principais</h2>
            <p>Altere os dados abaixo e clique em "Atualizar Perfil" para salvar.</p>
            
            <form id="form-edit-artista">
                <div class="form-group">
                    <label for="artista-nome">Nome do Artista</label>
                    <input type="text" id="artista-nome" required>
                </div>
                
                <div class="form-group">
                    <label for="artista-imagem">Trocar Imagem Principal (opcional)</label>
                    <input type="file" id="artista-imagem" accept="image/*">
                    <p><em>Deixe em branco se não quiser mudar a imagem atual.</em></p>
                </div>
                
                <div class="form-group">
                    <label for="artista-instagram">Instagram (Ex: @pixo.sp)</label>
                    <input type="text" id="artista-instagram">
                </div>
                
                <div class="form-group">
                    <label for="artista-categorias">Categorias (separadas por vírgula)</label>
                    <input type="text" id="artista-categorias">
                </div>
                
                <button type="submit" id="botao-atualizar-artista">Atualizar Perfil</button>
            </form>
            
            <div id="update-status" class="status-message"></div>
        </section>
        
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
